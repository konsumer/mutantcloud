<!doctype html>
<!-- The link preview picture (public/og.png, 1200 × 630): npm run og. Everything that matters sits in the middle
     630 × 630 square, since Facebook's small previews (in comments, on phones) crop to that square; the sides are decoration. -->
<html>
  <head>
    <meta charset="utf-8" />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&display=block" rel="stylesheet" />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
      }
      html,
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: #15131b;
      }
      body {
        position: relative;
        font-family: 'Bricolage Grotesque', system-ui, sans-serif;
        color: #f4f1f8;
        background: radial-gradient(520px 420px at 1150px 80px, rgba(255, 92, 138, 0.38), transparent 70%), radial-gradient(520px 420px at 40px 600px, rgba(32, 160, 140, 0.32), transparent 70%), radial-gradient(420px 300px at 980px 640px, rgba(110, 80, 230, 0.35), transparent 70%), radial-gradient(360px 300px at 120px 40px, rgba(255, 180, 40, 0.14), transparent 70%), #15131b;
      }
      .bar {
        position: absolute;
        inset: 0 0 auto;
        height: 10px;
        background: linear-gradient(90deg, #ff5c8a, #ffb02e, #20b49a, #6e8bff, #a66bff);
      }
      /* the middle square */
      .mid {
        position: absolute;
        left: 285px;
        top: 0;
        width: 630px;
        height: 630px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 40px 30px 30px;
      }
      .mascot {
        width: 250px;
        height: 250px;
        margin-bottom: -18px;
        filter: drop-shadow(0 18px 30px rgba(0, 0, 0, 0.45));
        transform: rotate(-6deg);
      }
      .word {
        font-size: 74px;
        font-weight: 800;
        letter-spacing: -2px;
        line-height: 1;
      }
      .word b {
        color: #ff5c8a;
      }
      .tag {
        margin-top: 22px;
        font-size: 37px;
        font-weight: 700;
        line-height: 1.32;
        letter-spacing: -0.5px;
        color: #d9d3e3;
      }
      .pill {
        display: inline-block;
        padding: 0 12px;
        border-radius: 12px;
        color: #fff;
      }
      .fm1 {
        background: #6a2a44;
      }
      .smk {
        background: #144a44;
      }
      /* little device tiles, on the sides */
      .tile {
        position: absolute;
        width: 76px;
        height: 76px;
        border-radius: 18px;
        border: 4px solid var(--c);
        background: #1d1a24;
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 6px;
        padding: 13px;
        box-shadow: 0 12px 26px rgba(0, 0, 0, 0.45);
      }
      .tile i {
        border-radius: 3px;
        background: #3a3545;
      }
      .tile i.on {
        background: var(--c);
      }
      .chips {
        position: absolute;
        display: flex;
        flex-direction: column;
        gap: 14px;
        font-size: 22px;
        font-weight: 700;
      }
      .chips span {
        padding: 8px 18px;
        border-radius: 999px;
        background: rgba(29, 26, 36, 0.85);
        border: 2px solid #2e2a38;
        white-space: nowrap;
      }
      .chips span::before {
        content: '';
        display: inline-block;
        width: 14px;
        height: 14px;
        border-radius: 50%;
        margin-right: 10px;
        background: var(--c);
      }
    </style>
  </head>
  <body>
    <div class="bar"></div>

    <div class="mid">
      <svg class="mascot" viewBox="0 0 32 32" aria-hidden="true">
        <path fill="#ff5c8a" d="M8 22c-4 0-6-3-6-6s3-6 6-6c1-4 4-7 8-7 5 0 8 4 8 8 4 0 6 3 6 6s-3 5-6 5H8z" />
        <circle cx="12" cy="15" r="2.4" fill="#fff" />
        <circle cx="12.6" cy="15.4" r="1.1" fill="#1d1a24" />
        <circle cx="20" cy="13" r="3.2" fill="#fff" />
        <circle cx="20.8" cy="13.6" r="1.5" fill="#1d1a24" />
        <path d="M13 21q4 3 8-1" stroke="#1d1a24" stroke-width="1.6" fill="none" stroke-linecap="round" />
      </svg>
      <div class="word">mutant<b>.cloud</b></div>
      <div class="tag">Every firmware &amp; tool for your<br /><span class="pill fm1">FM1</span>, <span class="pill smk">SMK-37</span> &amp; friends</div>
    </div>

    <div class="tile" style="--c: #ffb02e; left: 120px; top: 92px; transform: rotate(-12deg)"></div>
    <div class="tile" style="--c: #20b49a; left: 1010px; top: 300px; transform: rotate(10deg)"></div>
    <div class="tile" style="--c: #8a6bff; left: 180px; top: 440px; transform: rotate(8deg)"></div>
    <div class="tile" style="--c: #ff5c8a; left: 1050px; top: 88px; transform: rotate(-8deg); width: 60px; height: 60px; padding: 10px; gap: 4px"></div>

    <div class="chips" style="left: 40px; top: 238px">
      <span style="--c: #ffb02e">one open list</span>
    </div>
    <div class="chips" style="right: 34px; top: 440px; align-items: flex-end">
      <span style="--c: #20b49a">files checked</span>
      <span style="--c: #8a6bff">self-serve</span>
    </div>

    <script>
      // light up a few cells in each tile (the same every time)
      let seed = 7
      const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280
      for (const t of document.querySelectorAll('.tile')) {
        for (let i = 0; i < 16; i++) t.insertAdjacentHTML('beforeend', `<i class="${rnd() > 0.45 ? 'on' : ''}"></i>`)
      }
    </script>
  </body>
</html>
