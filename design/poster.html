<!doctype html>
<!-- source of public/og.png (the social share image). Re-render: npm run poster -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=JetBrains+Mono:wght@600&display=block" rel="stylesheet" />
    <style>
      :root {
        --bg: #15131b;
        --ink: #f3eff9;
        --muted: #a49db0;
        --c1: #ff5c8a;
        --c2: #ffb020;
        --c3: #19b5a5;
        --c4: #6c5cff;
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      html,
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: var(--bg);
      }
      body {
        position: relative;
        color: var(--ink);
        font-family: 'Bricolage Grotesque', system-ui, sans-serif;
      }
      /* soft colour glows, like the card stripes */
      .glow {
        position: absolute;
        border-radius: 50%;
        filter: blur(90px);
        opacity: 0.55;
      }
      .g1 {
        width: 520px;
        height: 520px;
        right: -120px;
        top: -160px;
        background: var(--c1);
      }
      .g2 {
        width: 420px;
        height: 420px;
        right: 180px;
        bottom: -260px;
        background: var(--c4);
        opacity: 0.45;
      }
      .g3 {
        width: 360px;
        height: 360px;
        left: -180px;
        bottom: -200px;
        background: var(--c3);
        opacity: 0.35;
      }
      .stripe {
        position: absolute;
        inset: 0 0 auto;
        height: 12px;
        background: linear-gradient(90deg, var(--c1), var(--c2), var(--c3), var(--c4));
      }
      .wrap {
        position: absolute;
        inset: 0;
        padding: 64px 72px 56px;
        display: flex;
        flex-direction: column;
      }
      .logo {
        display: flex;
        align-items: center;
        gap: 16px;
        font-weight: 800;
        font-size: 44px;
        letter-spacing: -0.02em;
      }
      .logo svg {
        width: 74px;
        height: 74px;
      }
      .logo b {
        color: var(--c1);
        font-weight: 800;
      }
      h1 {
        margin-top: 44px;
        max-width: 860px;
        font-size: 76px;
        line-height: 1.02;
        letter-spacing: -0.035em;
        font-weight: 800;
      }
      .hl {
        padding: 0 0.12em;
        border-radius: 0.18em;
      }
      .hl.a {
        background: color-mix(in srgb, var(--c1) 30%, transparent);
      }
      .hl.b {
        background: color-mix(in srgb, var(--c3) 30%, transparent);
      }
      .foot {
        margin-top: auto;
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 24px;
        font-weight: 700;
        color: var(--muted);
      }
      .chip {
        padding: 6px 16px;
        border-radius: 999px;
        border: 2px solid #2e2a38;
        background: #1e1b26;
        color: var(--ink);
      }
      .chip i {
        font-style: normal;
        color: var(--c2);
      }
      /* the mascot, big, peeking in from the right */
      .big {
        position: absolute;
        right: 34px;
        top: 150px;
        width: 330px;
        height: 330px;
        transform: rotate(-8deg);
        filter: drop-shadow(0 24px 40px rgba(0, 0, 0, 0.45));
      }
      /* little pixel-screen tiles floating around it, like firmware cards */
      .tile {
        position: absolute;
        width: 58px;
        height: 58px;
        border-radius: 12px;
        background: #0b0a0e;
        border: 3px solid var(--c);
        box-shadow: 0 10px 24px rgba(0, 0, 0, 0.4);
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 4px;
        padding: 8px;
      }
      .tile span {
        border-radius: 2px;
        background: #2a2633;
      }
      .tile span.on {
        background: var(--c);
      }
    </style>
  </head>
  <body>
    <div class="glow g1"></div>
    <div class="glow g2"></div>
    <div class="glow g3"></div>
    <div class="stripe"></div>

    <svg width="0" height="0" style="position: absolute">
      <symbol id="blob" viewBox="0 0 32 32">
        <path fill="#ff5c8a" d="M8 22c-4 0-6-3-6-6s3-6 6-6c1-4 4-7 8-7 5 0 8 4 8 8 4 0 6 3 6 6s-3 5-6 5H8z" />
        <circle cx="12" cy="15" r="2.4" fill="#fff" />
        <circle cx="12.6" cy="15.4" r="1.1" fill="#1d1a24" />
        <circle cx="20" cy="13" r="3.2" fill="#fff" />
        <circle cx="20.8" cy="13.6" r="1.5" fill="#1d1a24" />
        <path d="M13 21q4 3 8-1" stroke="#1d1a24" stroke-width="1.6" fill="none" stroke-linecap="round" />
      </symbol>
    </svg>

    <svg class="big" viewBox="0 0 32 32" aria-hidden="true"><use href="#blob" /></svg>

    <div class="tile" style="--c: var(--c2); right: 330px; top: 120px; transform: rotate(-10deg)"><span class="on"></span><span></span><span class="on"></span><span></span><span></span><span class="on"></span><span></span><span class="on"></span><span class="on"></span><span></span><span></span><span class="on"></span></div>
    <div class="tile" style="--c: var(--c3); right: 64px; top: 92px; transform: rotate(12deg)"><span></span><span class="on"></span><span class="on"></span><span></span><span class="on"></span><span></span><span class="on"></span><span class="on"></span><span></span><span class="on"></span><span></span><span></span></div>
    <div class="tile" style="--c: var(--c4); right: 300px; top: 430px; transform: rotate(8deg)"><span class="on"></span><span class="on"></span><span></span><span></span><span></span><span class="on"></span><span class="on"></span><span></span><span class="on"></span><span></span><span class="on"></span><span class="on"></span></div>

    <div class="wrap">
      <div class="logo">
        <svg viewBox="0 0 32 32" aria-hidden="true"><use href="#blob" /></svg>
        <span>mutant<b>.cloud</b></span>
      </div>
      <h1>Every firmware &amp; tool for your <span class="hl a">FM1</span>, <span class="hl b">SMK-37</span> &amp; friends.</h1>
      <div class="foot">
        <span class="chip"><i>●</i> one open list</span>
        <span class="chip">self-serve for makers</span>
        <span class="chip">every version kept</span>
      </div>
    </div>
  </body>
</html>
