# npm run sync, every day: new listings from the other hubs and from GitHub itself (searches, forks) and the FM-1 / SMK-37 subreddits. New versions of listed firmware don't wait for this: the worker's own watcher gets them.
# Needs the CLOUDFLARE_API_TOKEN secret (a token that can edit D1).
name: sync
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
    inputs:
      full:
        description: Re-read everything (every listing, every repo)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # the collector's caches (package checks, fork comparisons, ids): runs after the first are quicker
      - uses: actions/cache@v4
        with:
          path: data
          key: sync-data-${{ github.run_id }}
          restore-keys: sync-data-
      - run: npm run sync -- ${{ inputs.full && '--full' || '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
